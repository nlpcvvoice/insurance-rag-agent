<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insurance Knowledge Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    background: #f0f4f8;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #1e3a5f, #2d6a9f);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  header .badge {
    background: rgba(255,255,255,.18);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
  }
  .upload-btn {
    background: rgba(255,255,255,.15);
    color: #fff;
    border: 1px dashed rgba(255,255,255,.6);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: background .2s;
    margin-right: 8px;
  }
  .upload-btn:hover { background: rgba(255,255,255,.28); }
  .upload-status {
    text-align: center;
    font-size: 12px;
    padding: 6px 0;
    color: #57606a;
  }
  .upload-status.ok { color: #1a7f37; }
  .upload-status.err { color: #c0392b; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    display: flex;
    margin-bottom: 18px;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to {opacity: 1;} }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; margin-right: 12px;
    color: #fff;
  }
  .user .avatar { background: #7c4dff; }
  .bot .avatar { background: #2d6a9f; }
  .bubble {
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    max-width: 100%;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .user .bubble { background: #7048e8; color: #fff; }
  .sources {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed #d0d7de;
    font-size: 12px;
    color: #57606a;
  }
  .sources span { display: inline-block; margin-right: 6px; }
  .src-chip {
    background: #eef2f6;
    color: #2d6a9f;
    border-radius: 12px;
    padding: 2px 10px;
    font-size: 11px;
    font-family: monospace;
  }
  .typing { color: #8a94a0; font-style: italic; }
  .error { color: #c0392b; }
  footer {
    border-top: 1px solid #e2e8f0;
    background: #fff;
    padding: 14px 24px;
  }
  .input-row {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 12px;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 2px solid #d0d7de;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.4;
    max-height: 160px;
    outline: none;
  }
  textarea:focus { border-color: #2d6a9f; }
  button {
    background: #2d6a9f;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 15px;
    cursor: pointer;
    transition: background .2s;
  }
  button:hover { background: #1e4a70; }
  button:disabled { background: #a0b4c6; cursor: not-allowed; }
  .hint { text-align: center; color: #8a94a0; font-size: 13px; padding: 24px 0 8px; }
  .chips { text-align: center; margin-bottom: 18px; }
  .chip {
    display: inline-block;
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 20px;
    padding: 6px 14px;
    margin: 4px;
    font-size: 12px;
    color: #2d6a9f;
    cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { background: #e8f0f8; border-color: #2d6a9f; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🛡️ Insurance Knowledge Assistant</h1>
    <div class="sub">RAG + Gemini · Local Vector Store</div>
  </div>
  <div>
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📤 Upload Document (.txt / .pdf)</button>
    <input type="file" id="fileInput" accept=".txt,.pdf" style="display:none" onchange="uploadFile(event)">
    <span class="badge">RAG Retrieval</span>
  </div>
</header>

<main id="chat">
  <div class="hint">👇 Ask about insurance, or pick an example below</div>
  <div class="chips">
    <span class="chip" onclick="ask('What does dwelling coverage in homeowners insurance cover?')">Homeowners 🏠</span>
    <span class="chip" onclick="ask('What is the difference between collision and comprehensive auto coverage?')">Auto 🚗</span>
    <span class="chip" onclick="ask('What is cash value in life insurance?')">Life 💰</span>
    <span class="chip" onclick="ask('What is First Notice of Loss in the claims process?')">Claims 📋</span>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="Type your question and press Enter..." onkeydown="onKey(event)"></textarea>
    <button id="send" onclick="send()">Send</button>
  </div>
</footer>
<div id="uploadStatus" class="upload-status"></div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function appendMessage(role, text) {
    const row = document.createElement('div');
    row.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🧑' : '🤖';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '';
    const pre = document.createElement('div');
    pre.textContent = text;
    bubble.appendChild(pre);
    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function appendSources(bubble, sources) {
    const uniq = [...new Set(sources)].filter(Boolean);
    if (uniq.length === 0) return;
    const src = document.createElement('div');
    src.className = 'sources';
    src.innerHTML = '<span>📄 Sources:</span>';
    uniq.forEach(s => {
      const chip = document.createElement('span');
      chip.className = 'src-chip';
      chip.textContent = s.split('/').pop();
      src.appendChild(chip);
    });
    bubble.appendChild(src);
  }

  async function ask(q) {
    if (!q.trim()) return;
    input.value = '';
    input.style.height = 'auto';
    appendMessage('user', q);
    const bubble = appendMessage('bot', 'Thinking...');
    bubble.classList.add('typing');
    sendBtn.disabled = true;
    try {
      const res = await fetch('query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q, top_k: 5 })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Request failed');
      bubble.classList.remove('typing');
      bubble.textContent = data.answer;
      appendSources(bubble, data.sources);
    } catch (e) {
      bubble.classList.remove('typing');
      bubble.classList.add('error');
      bubble.textContent = 'Error: ' + e.message;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function send() { ask(input.value); }

  function setUploadStatus(msg, type) {
    const el = document.getElementById('uploadStatus');
    el.textContent = msg;
    el.className = 'upload-status ' + (type || '');
  }

  async function uploadFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const ext = '.' + file.name.split('.').pop().toLowerCase();
    if (ext !== '.txt' && ext !== '.pdf') {
      setUploadStatus('Unsupported file type. Only .txt and .pdf allowed.', 'err');
      event.target.value = '';
      return;
    }
    setUploadStatus('Uploading ' + file.name + '...');
    const formData = new FormData();
    formData.append('file', file);
    try {
      const res = await fetch('upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Upload failed');
      setUploadStatus('✅ ' + data.message + ' (' + data.num_chunks + ' chunk(s), ' +
                      data.documents_count + ' docs total)', 'ok');
    } catch (e) {
      setUploadStatus('Error: ' + e.message, 'err');
    } finally {
      event.target.value = '';
    }
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
    // auto-grow textarea
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }
</script>
</body>
</html>
